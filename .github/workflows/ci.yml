name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  phase-0:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.31"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Run pytest and ruff on the 50-row fixture
        env:
          FORGE_FIXTURE: tests/fixtures/complaints_50.jsonl
        run: make test
      - name: Build and test the gateway with Clang sanitizers
        run: make gateway-test
