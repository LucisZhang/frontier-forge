name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  phase-0:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.31"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Install gateway system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libboost-json-dev libboost-system-dev libgtest-dev
      - name: Run pytest and ruff on the 50-row fixture
        env:
          FORGE_FIXTURE: tests/fixtures/complaints_50.jsonl
        run: make test
      - name: Build and test the gateway with Clang sanitizers
        run: make gateway-test

  phase-7-2-kind:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.31"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Install kind
        uses: helm/kind-action@v1.12.0
        with:
          install_only: true
          version: v0.30.0
      - name: Validate Phase 7.2 deployment contracts
        run: make phase7-2-manifest-test
      - name: Run CPU-only kind smoke with mock upstream
        run: make phase7-2-kind-smoke
