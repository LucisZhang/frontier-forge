[project]
name = "frontier-forge"
version = "0.1.0"
description = "Post-training and serving experiments for a structured-triage task."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "duckdb==1.5.5",
  "httpx==0.28.1",
  "jsonschema>=4.25,<5",
  "numpy==2.2.6",
  "pyyaml==6.0.3",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
  "yamllint>=1.37,<2",
]
train = [
  "accelerate==1.14.0",
  "datasets>=4.0,<5",
  "peft==0.20.0",
  "pyarrow==25.0.0",
  "torch==2.13.0",
  "torchvision==0.28.0",
  "transformers==5.15.0",
  "trl==1.10.0",
]
remote-reference = [
  "bitsandbytes==0.50.1; sys_platform == 'linux'",
  "gptqmodel==7.3.2; sys_platform == 'linux'",
  "optimum==2.2.0; sys_platform == 'linux'",
]
remote-serve = [
  "vllm==0.17.0; sys_platform == 'linux'",
]
unsloth-train = [
  "bitsandbytes==0.50.1; sys_platform == 'linux'",
  "unsloth==2026.8.18; sys_platform == 'linux'",
  "trl==0.24.0",
]

[tool.uv]
default-groups = ["dev", "train"]
conflicts = [
  [
    { group = "train" },
    { group = "unsloth-train" },
  ],
  [
    { group = "train" },
    { group = "remote-serve" },
  ],
  [
    { group = "unsloth-train" },
    { group = "remote-serve" },
  ],
  [
    { group = "remote-reference" },
    { group = "remote-serve" },
  ],
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forge"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["gateway/build"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]
