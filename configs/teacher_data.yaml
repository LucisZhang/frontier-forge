  smoke_candidate_cap: 10
  ordering: blake2b(seed:complaint_id), complaint_id

teacher:
  model: anthropic/claude-haiku-4.5
  mock_model: mock/phase2-deterministic-v1
  prompt: configs/teacher_prompts/phase2_teacher_v1.txt
  temperature: 0.0
  max_tokens: 512
  timeout_seconds: 90.0
  concurrency: 16
  max_retries: 3
  max_budget_usd: 20.0
  planning_cost_per_call_usd: 0.0032

filter:
  require_schema_valid: true
  require_task_success: true
  require_tool_arguments_semantic_valid: true
  minhash:
    token_ngram: 5
    permutations: 64
    bands: 16
    similarity_threshold: 0.85
  contamination:
    token_ngram: 13
    policy: any exact normalized n-gram overlap quarantines the TRAIN sample

dpo:
  rejected_source: deterministic_perturbed_near_miss
  perturbation_taxonomy:
    - urgency_cycle
    - tool_choice_substitution
    - ambiguity_flip

outputs:
  full_dir: data/phase2
  smoke_dir: data/smoke/phase2
  tracked_manifest: results/phase2_manifest.json
  data_card: results/phase2_data_card.md
  cost_ledger: results/phase2_cost_ledger.json
