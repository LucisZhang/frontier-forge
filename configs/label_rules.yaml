version: 3
taxonomy:
  provenance: nlp-eval-lab/taxonomy_map.yaml@v1
  product_map:
    Bank account or service: deposit_account
    Checking or savings account: deposit_account
    Consumer Loan: vehicle_loan
    Credit card: card
    Credit card or prepaid card: card
    Credit reporting: credit_reporting
    Credit reporting, credit repair services, or other personal consumer reports: credit_reporting
    Credit reporting or other personal consumer reports: credit_reporting
    Debt collection: debt_collection
    Debt or credit management: credit_reporting
    Money transfer, virtual currency, or money service: money_service
    Money transfers: money_service
    Mortgage: mortgage
    Payday loan: payday_personal_loan
    Payday loan, title loan, or personal loan: payday_personal_loan
    Payday loan, title loan, personal loan, or advance loan: payday_personal_loan
    Prepaid card: card
    Student loan: student_loan
    Vehicle loan or lease: vehicle_loan
    Virtual currency: money_service

# Keyword matching is Unicode NFKC, whitespace-collapsed, and case-insensitive.
# Ambiguity, medium urgency, and no-action phrases use issue + narrative. Strong
# actions are narrower in v3: high-urgency escalation and refund phrases use the
# narrative only. Source taxonomy strings such as "Credit monitoring or identity
# theft protection services", "Identity theft protection or other monitoring
# services", and legacy "Loan modification,collection,foreclosure" are context,
# never strong-action evidence by themselves.
ambiguity:
  min_narrative_chars: 40
  # Phrase triggers are weak evidence. They may add a missing-details signal
  # only to short narratives; at 201+ characters they cannot create ambiguity
  # unless a source field is missing or another hard rule applies.
  phrase_trigger_max_narrative_chars: 200
  phrases:
    - not sure
    - do not know what happened
    - don't know what happened
    - insufficient information
    - no details available
  missing_field_order: [product, issue, company, details]

urgency:
  high_keywords:
    - foreclosure
    - eviction
    - identity theft
    - garnishment
    - repossession
    - threatened to take legal action
    - unable to access funds
    - account takeover
  medium_keywords:
    - fraud
    - unauthorized
    - dispute
    - incorrect information
    - late fee
    - collection
    - charged
    - denied
  default: low

tools:
  # Parsed by forge.data.labels and asserted against the code's branch order.
  priority:
    - request_more_info
    - close_no_action
    - escalate_to_regulator
    - start_refund_workflow
    - route_to_company
    - close_no_action_fallback
  no_action_phrases:
    - issue was resolved
    - problem was resolved
    - company resolved the issue
    - filed in error
    - duplicate complaint
  refund_phrases:
    - refund
    - reimbursement
    - money back
    - reverse the charge
    - chargeback

# Known v3 limitations (documented, intentionally not fixed in Phase 1.2):
# - keyword matching is negation-blind, including negated "identity theft" text;
# - the taxonomy emits one action, and escalation outranks refund for complaints
#   whose narrative supports both remedies.

teacher_spot_labels:
  model: anthropic/claude-haiku-4.5
  max_budget_usd: 10.0
  selection: deterministic ambiguous CAL rows only
  application: audit-only; frozen rule labels are never silently overwritten
