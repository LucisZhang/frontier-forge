apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-bf16
  namespace: forge-system
  labels:
    app.kubernetes.io/name: vllm-bf16
    forge.openai.com/precision: bf16
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: vllm-bf16
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vllm-bf16
        forge.openai.com/precision: bf16
    spec:
      runtimeClassName: nvidia
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.17.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
          args:
            - /mnt/frontier-forge/repo/checkpoints/full/r1b/trl/s0/export/merged_bf16_mtp_preserved
            - --served-model-name
            - forge-r1b
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            - --max-model-len
            - "4096"
            - --max-num-seqs
            - "8"
            - --dtype
            - bfloat16
            - --gpu-memory-utilization
            - "0.56"
            - --generation-config
            - vllm
            - --language-model-only
            - --no-enable-log-requests
            - --enable-request-id-headers
            - --enable-auto-tool-choice
            - --tool-call-parser
            - hermes
            - --structured-outputs-config
            - '{"backend":"auto","disable_fallback":false}'
            - --enforce-eager
          env:
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: HF_HOME
              value: /cache/huggingface
            - name: VLLM_CACHE_ROOT
              value: /cache/vllm
            - name: TMPDIR
              value: /cache/tmp
          ports:
            - name: http
              containerPort: 8000
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 360
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            timeoutSeconds: 1
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 2
          resources:
            requests:
              cpu: "2"
              memory: 10Gi
              nvidia.com/gpu.shared: "1"
            limits:
              cpu: "8"
              memory: 24Gi
              nvidia.com/gpu.shared: "1"
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
            - name: checkpoints
              mountPath: /mnt/frontier-forge/repo/checkpoints
              readOnly: true
            - name: hf-archive
              mountPath: /mnt/frontier-forge/cache/huggingface
              readOnly: true
            - name: cache
              mountPath: /cache
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
        - name: checkpoints
          persistentVolumeClaim:
            claimName: forge-model-checkpoints
            readOnly: true
        - name: hf-archive
          persistentVolumeClaim:
            claimName: forge-huggingface-archive
            readOnly: true
        - name: cache
          emptyDir: {}
      terminationGracePeriodSeconds: 30
