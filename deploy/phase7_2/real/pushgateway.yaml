apiVersion: apps/v1
kind: Deployment
metadata:
  name: forge-pushgateway
  namespace: forge-system
  labels:
    app.kubernetes.io/name: forge-pushgateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: forge-pushgateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: forge-pushgateway
    spec:
      automountServiceAccountToken: false
      containers:
        - name: pushgateway
          image: prom/pushgateway:v1.11.2
          args:
            - --web.listen-address=:9091
          ports:
            - name: http
              containerPort: 9091
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 2
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: forge-pushgateway
  namespace: forge-system
  labels:
    app.kubernetes.io/name: forge-pushgateway
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: forge-pushgateway
  ports:
    - name: http
      port: 9091
      targetPort: http
