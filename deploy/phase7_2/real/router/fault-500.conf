upstream forge_vllm {
    server forge-fault-upstream.forge-system.svc.cluster.local:18080;
    keepalive 32;
}

server {
    listen 8080;
    location / {
        add_header X-Forge-Upstream $upstream_addr always;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_pass http://forge_vllm;
        proxy_read_timeout 10s;
    }
}
