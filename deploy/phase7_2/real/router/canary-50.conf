upstream forge_vllm {
    server vllm-int4.forge-system.svc.cluster.local:8000 weight=1;
    server vllm-bf16.forge-system.svc.cluster.local:8000 weight=1;
    keepalive 64;
}

server {
    listen 8080;
    location / {
        add_header X-Forge-Upstream $upstream_addr always;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_pass http://forge_vllm;
        proxy_read_timeout 120s;
        proxy_connect_timeout 2s;
    }
}
