apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
  - local-model-volumes.yaml
  - vllm-int4.yaml
  - vllm-bf16.yaml
  - vllm-services.yaml
  - router-deployment.yaml
  - router-service.yaml
  - fault-upstreams.yaml
  - pushgateway.yaml
  - service-monitors.yaml
  - keda-scalers.yaml
  - monitoring/prometheus-rules.yaml
configMapGenerator:
  - name: vllm-router-config
    namespace: forge-system
    files:
      - default.conf=router/stable.conf
  - name: forge-fault-upstream
    namespace: forge-system
    files:
      - server.py=fault_server.py
generatorOptions:
  disableNameSuffixHash: true
