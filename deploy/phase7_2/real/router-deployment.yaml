apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-router
  namespace: forge-system
  labels:
    app.kubernetes.io/name: vllm-router
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vllm-router
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vllm-router
    spec:
      automountServiceAccountToken: false
      containers:
        - name: router
          image: nginx:1.29.1-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 2
          resources:
            requests:
              cpu: 20m
              memory: 24Mi
            limits:
              cpu: 500m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d
              readOnly: true
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
      volumes:
        - name: config
          configMap:
            name: vllm-router-config
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
