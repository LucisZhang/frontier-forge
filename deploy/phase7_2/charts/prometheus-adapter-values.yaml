prometheus:
  url: http://monitoring-kube-prometheus-prometheus.monitoring.svc
  port: 9090
rules:
  default: false
  custom:
    - seriesQuery: 'forge_gateway_queue_depth{namespace!="",pod!=""}'
      resources:
        overrides:
          namespace:
            resource: namespace
          pod:
            resource: pod
      name:
        matches: ^forge_gateway_queue_depth$
        as: forge_gateway_queue_depth
      metricsQuery: max(<<.Series>>{<<.LabelMatchers>>}) by (<<.GroupBy>>)
    - seriesQuery: 'forge_gateway_request_duration_seconds_bucket{namespace!="",pod!=""}'
      resources:
        overrides:
          namespace:
            resource: namespace
          pod:
            resource: pod
      name:
        matches: ^forge_gateway_request_duration_seconds_bucket$
        as: forge_gateway_p95_latency_seconds
      metricsQuery: >-
        histogram_quantile(0.95,
        sum(rate(forge_gateway_request_duration_seconds_bucket{<<.LabelMatchers>>}[1m]))
        by (le, <<.GroupBy>>))
