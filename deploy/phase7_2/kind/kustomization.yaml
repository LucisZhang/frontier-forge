apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
  - mock-upstream-deployment.yaml
  - mock-upstream-service.yaml
patches:
  - path: gateway-patch.yaml
configMapGenerator:
  - name: forge-mock-upstream
    namespace: forge-system
    files:
      - server.py
generatorOptions:
  disableNameSuffixHash: true
