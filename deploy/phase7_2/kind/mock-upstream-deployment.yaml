apiVersion: apps/v1
kind: Deployment
metadata:
  name: forge-mock-upstream
  namespace: forge-system
  labels:
    app.kubernetes.io/name: forge-mock-upstream
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: forge-mock-upstream
  template:
    metadata:
      labels:
        app.kubernetes.io/name: forge-mock-upstream
    spec:
      automountServiceAccountToken: false
      containers:
        - name: upstream
          image: python:3.12-alpine
          imagePullPolicy: IfNotPresent
          command:
            - python
            - /opt/forge/server.py
            - --port
            - "8000"
            - --mode
            - healthy
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 1
          resources:
            requests:
              cpu: 20m
              memory: 24Mi
            limits:
              cpu: 200m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: server
              mountPath: /opt/forge
              readOnly: true
      volumes:
        - name: server
          configMap:
            name: forge-mock-upstream
